spring:
  application:
    name: proclenz

  datasource:
    url: jdbc:postgresql://localhost:5432/proclenz
    username: proclenz
    password: proclenz

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
